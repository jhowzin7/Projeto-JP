<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asper — Quadro Kanban Colaborativo</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .board-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-right: 4px; }
    .badge-alta, .badge-urgente { background: #fee2e2; color: #b91c1c; }
    .badge-media, .badge-bug { background: #fef3c7; color: #b45309; }
    .badge-baixa, .badge-feature { background: #dbeafe; color: #1d4ed8; }
    .badge-sp { background: #f3e8ff; color: #6b21a8; }
    .card-meta { font-size: 12px; color: var(--color-muted); margin-top: 8px; display: flex; justify-content: space-between; }
    .member-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--color-border); }
  </style>
</head>
<body data-page="kanban">
  <header class="app-header">
    <a class="brand" href="kanban.html"><span class="brand-mark">A</span>Asper</a>
    <div style="display: flex; gap: 12px; align-items: center;">
      <span id="current-user-email" style="font-size: 13px; color: var(--color-muted);"></span>
      <button class="button button-ghost" id="logout-button" type="button">Sair</button>
    </div>
  </header>

  <main class="board-main">
    <div class="board-controls">
      <select id="board-selector" class="input" style="max-width: 280px;" aria-label="Selecionar quadro"></select>
      <button class="button button-ghost" id="new-board-button" type="button">+ Novo Quadro</button>
      <button class="button button-ghost" id="share-board-button" type="button">Compartilhar Quadro</button>
      <span id="role-badge" class="badge badge-feature"></span>
      <button class="button button-primary" id="add-task-button" type="button" style="margin-left: auto;">＋ Adicionar nova tarefa</button>
    </div>

    <section class="board-grid" aria-label="Quadro Kanban">
      <div class="board-column" data-status="todo">
        <header class="column-header">
          <h2>A Fazer</h2>
          <span class="column-count" data-count="todo">0</span>
        </header>
        <div class="task-list" data-list="todo"></div>
      </div>

      <div class="board-column" data-status="progress">
        <header class="column-header">
          <h2>Em Andamento</h2>
          <span class="column-count" data-count="progress">0</span>
        </header>
        <div class="task-list" data-list="progress"></div>
      </div>

      <div class="board-column" data-status="done">
        <header class="column-header">
          <h2>Concluído</h2>
          <span class="column-count" data-count="done">0</span>
        </header>
        <div class="task-list" data-list="done"></div>
      </div>
    </section>
  </main>

  <!-- Modal Nova Tarefa -->
  <dialog id="task-dialog" class="modal">
    <form id="task-form" class="modal-card" novalidate>
      <div class="modal-header">
        <h2>Nova Tarefa</h2>
        <button type="button" id="close-task-dialog" class="icon-button" aria-label="Fechar">×</button>
      </div>
      <div class="field">
        <label for="task-title">Título *</label>
        <input id="task-title" type="text" required>
        <small id="task-title-error" class="field-error"></small>
      </div>
      <div class="field">
        <label for="task-description">Descrição</label>
        <textarea id="task-description" rows="2"></textarea>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="field">
          <label for="task-priority">Prioridade</label>
          <select id="task-priority">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>
        <div class="field">
          <label for="task-label">Label</label>
          <select id="task-label">
            <option value="feature">Feature</option>
            <option value="bug">Bug</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="field">
          <label for="task-due">Prazo</label>
          <input id="task-due" type="date">
        </div>
        <div class="field">
          <label for="task-points">Story Points (Scrum)</label>
          <input id="task-points" type="number" min="1" max="21" value="3">
        </div>
      </div>
      <div class="field">
        <label for="task-assignee">Responsável</label>
        <select id="task-assignee"></select>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancel-task" class="button button-ghost">Cancelar</button>
        <button type="submit" class="button button-primary">Criar Tarefa</button>
      </div>
    </form>
  </dialog>

  <!-- Modal Compartilhar Quadro -->
  <dialog id="share-dialog" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Compartilhar Quadro</h2>
        <button type="button" id="close-share-dialog" class="icon-button">×</button>
      </div>
      <form id="invite-form" style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input id="invite-email" type="email" placeholder="E-mail do usuário" required style="flex: 1;">
        <select id="invite-role">
          <option value="EDITOR">Editor</option>
          <option value="VIEWER">Leitor</option>
        </select>
        <button type="submit" class="button button-primary">Convidar</button>
      </form>
      <h3 style="font-size: 14px; margin-bottom: 8px;">Membros com acesso</h3>
      <div id="members-list"></div>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="js/auth.js" defer></script>
  <script src="js/kanban.js" defer></script>
</body>
</html>
