<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Asper — Meu quadro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="kanban">
  <header class="app-header">
    <a class="brand" href="index.html" aria-label="Asper — página inicial"><span class="brand-mark" aria-hidden="true">A</span>Asper</a>
    <nav class="app-nav" aria-label="Navegação do quadro">
      <a class="app-home-link" href="index.html">Página inicial</a>
      <div class="user-menu">
        <button class="user-menu-trigger" id="user-menu-trigger" type="button" aria-expanded="false" aria-controls="user-menu-panel">
          <span class="avatar" id="header-avatar" aria-hidden="true">A</span>
          <span class="user-trigger-name" id="header-name">Usuário</span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <section class="user-menu-panel" id="user-menu-panel" aria-label="Perfil do usuário" hidden>
          <p class="profile-eyebrow">SEU PERFIL</p>
          <div class="profile-summary">
            <span class="avatar avatar-large" id="profile-avatar" aria-hidden="true">A</span>
            <div><strong id="profile-name">Usuário</strong><span id="profile-email">email@exemplo.com</span></div>
          </div>
          <form id="profile-form" class="profile-form">
            <label for="display-name">Nome de exibição</label>
            <input id="display-name" name="displayName" type="text" maxlength="40" required>
            <button class="button button-secondary button-full button-small" type="submit">Salvar nome</button>
          </form>
          <button class="menu-logout" type="button" data-logout>Sair da conta <span aria-hidden="true">↗</span></button>
        </section>
      </div>
      <button class="button button-outline button-small logout-header" type="button" data-logout>Sair</button>
    </nav>
  </header>
  <main class="board-main">
    <section class="board-heading">
      <div>
        <p class="eyebrow">SEU ESPAÇO DE TRABALHO</p>
        <h1>Meu quadro<span class="text-accent">.</span></h1>
        <p class="board-subtitle">Organize as tarefas e acompanhe seu progresso.</p>
      </div>
      <button class="button button-primary" id="add-task-button" type="button"><span aria-hidden="true">＋</span> Adicionar nova tarefa</button>
    </section>
    <div class="board-hint" id="board-hint">Dica: arraste os cartões entre as colunas ou use “Mover para” em cada tarefa.</div>
    <section class="board" aria-label="Quadro Kanban">
      <section class="board-column" data-status="todo" aria-labelledby="todo-heading">
        <header class="column-header">
          <div class="column-title"><span class="status-dot status-todo" aria-hidden="true"></span><h2 id="todo-heading">A Fazer</h2></div>
          <span class="column-count" data-count="todo" aria-label="0 tarefas">0</span>
        </header>
        <div class="task-list" data-list="todo"></div>
      </section>
      <section class="board-column" data-status="progress" aria-labelledby="progress-heading">
        <header class="column-header">
          <div class="column-title"><span class="status-dot status-progress" aria-hidden="true"></span><h2 id="progress-heading">Em Andamento</h2></div>
          <span class="column-count" data-count="progress" aria-label="0 tarefas">0</span>
        </header>
        <div class="task-list" data-list="progress"></div>
      </section>
      <section class="board-column" data-status="done" aria-labelledby="done-heading">
        <header class="column-header">
          <div class="column-title"><span class="status-dot status-done" aria-hidden="true"></span><h2 id="done-heading">Concluído</h2></div>
          <span class="column-count" data-count="done" aria-label="0 tarefas">0</span>
        </header>
        <div class="task-list" data-list="done"></div>
      </section>
    </section>
  </main>
  <dialog class="task-dialog" id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form" novalidate>
      <div class="dialog-heading">
        <div><p class="eyebrow">NOVA TAREFA</p><h2 id="task-dialog-title">Adicionar tarefa</h2></div>
        <button class="dialog-close" id="close-task-dialog" type="button" aria-label="Fechar">×</button>
      </div>
      <div class="field">
        <label for="task-title">Título</label>
        <input id="task-title" name="title" type="text" maxlength="120" required aria-describedby="task-title-error">
        <p class="field-error" id="task-title-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="task-description">Descrição <span class="label-hint">(opcional)</span></label>
        <textarea id="task-description" name="description" rows="4" maxlength="500"></textarea>
      </div>
      <div class="dialog-actions">
        <button class="button button-outline" id="cancel-task" type="button">Cancelar</button>
        <button class="button button-primary" type="submit">Salvar tarefa</button>
      </div>
    </form>
  </dialog>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="js/auth.js" defer></script>
  <script src="js/kanban.js" defer></script>
</body>
</html>
