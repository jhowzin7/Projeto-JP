<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanban Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Meu Kanban<small>Arraste os cards entre as colunas</small></h1>
  <button class="btn" id="addBtn">+ Adicionar Nova Tarefa</button>
</header>

<p class="storage-status" id="storageStatus" role="status" aria-live="polite"></p>
<main class="board" id="board"></main>

<dialog id="modal">
  <form id="form">
    <h2>Nova tarefa</h2>
    <label for="title">Título
      <input id="title" maxlength="80" required placeholder="Ex.: Revisar proposta">
    </label>
    <label for="desc">Descrição
      <textarea id="desc" rows="4" maxlength="400" placeholder="Detalhes da atividade (opcional)"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="submit" class="btn">Adicionar</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
