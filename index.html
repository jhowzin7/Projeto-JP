<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanban Board</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f4f8;--surface:#fff;--col:#e9ebf2;--text:#1c2030;--muted:#6b7285;--border:#dcdfe9;
  --accent:#4f46e5;--accent-fg:#fff;--danger:#e11d48;--shadow:0 1px 3px rgba(20,24,50,.08),0 4px 14px rgba(20,24,50,.06);
  --c1:#f59e0b;--c2:#3b82f6;--c3:#10b981;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1220;--surface:#1b2033;--col:#151a2b;--text:#e8eaf3;--muted:#98a0b8;--border:#2a3150;
    --accent:#818cf8;--accent-fg:#0f1220;--danger:#fb7185;--shadow:0 1px 3px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1220;--surface:#1b2033;--col:#151a2b;--text:#e8eaf3;--muted:#98a0b8;--border:#2a3150;
  --accent:#818cf8;--accent-fg:#0f1220;--danger:#fb7185;--shadow:0 1px 3px rgba(0,0,0,.4);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 24px;max-width:1200px;margin:0 auto}
h1{font-size:1.4rem;margin:0;letter-spacing:-.02em}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:2px;letter-spacing:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-fg);border:0;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--border)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1200px;margin:0 auto;padding:0 24px 32px;align-items:start}
.column{background:var(--col);border-radius:16px;padding:14px;min-height:240px;border:2px solid transparent;transition:border-color .15s,background .15s}
.column.over{border-color:var(--accent)}
.col-head{display:flex;align-items:center;gap:8px;margin:2px 4px 12px;font-weight:600;font-size:.95rem}
.dot{width:10px;height:10px;border-radius:50%}
.count{margin-left:auto;background:var(--surface);color:var(--muted);font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--border)}
.list{display:flex;flex-direction:column;gap:10px;min-height:120px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:grab;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-1px)}
.card.dragging{opacity:.4;cursor:grabbing}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{margin:0;font-size:.95rem;line-height:1.35;word-break:break-word}
.card p{margin:6px 0 0;font-size:.85rem;color:var(--muted);line-height:1.45;white-space:pre-wrap;word-break:break-word}
.icon{background:transparent;border:0;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:1rem;line-height:1;flex:none}
.icon:hover{background:var(--col);color:var(--danger)}
.moves{display:none;gap:6px;margin-top:10px}
.moves .icon{border:1px solid var(--border);width:auto;padding:0 10px;color:var(--text);font-size:.8rem}
.moves .icon:hover{color:var(--accent)}
@media (hover:none){.moves{display:flex}}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:22px 8px;border:2px dashed var(--border);border-radius:12px}
.storage-status{max-width:1200px;margin:0 auto 18px;padding:0 24px;color:var(--muted);font-size:.82rem}
.storage-status.error{color:var(--danger)}
dialog{border:0;border-radius:16px;padding:0;width:min(440px,92vw);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,25,.55);backdrop-filter:blur(2px)}
form{padding:22px;display:flex;flex-direction:column;gap:14px}
form h2{margin:0;font-size:1.15rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600}
input,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;justify-content:flex-end;gap:10px}
@media (max-width:820px){.board{grid-template-columns:1fr;padding:0 16px 24px}header{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Meu Kanban<small>Arraste os cards entre as colunas</small></h1>
  <button class="btn" id="addBtn">+ Adicionar Nova Tarefa</button>
</header>

<p class="storage-status" id="storageStatus" role="status" aria-live="polite"></p>
<main class="board" id="board"></main>

<dialog id="modal">
  <form id="form">
    <h2>Nova tarefa</h2>
    <label for="title">Título
      <input id="title" maxlength="80" required placeholder="Ex.: Revisar proposta">
    </label>
    <label for="desc">Descrição
      <textarea id="desc" rows="4" maxlength="400" placeholder="Detalhes da atividade (opcional)"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="submit" class="btn">Adicionar</button>
    </div>
  </form>
</dialog>

<script>
const COLUMNS = [
  {id:'todo',  name:'A Fazer',      color:'var(--c1)'},
  {id:'doing', name:'Em Andamento', color:'var(--c2)'},
  {id:'done',  name:'Concluído',    color:'var(--c3)'}
];
const KEY = 'kanban-tasks-v1';
const storageStatus = document.getElementById('storageStatus');
let tasks = load();
let dragId = null;

function load(){
  const fallback = [
    {id:uid(), title:'Bem-vindo ao Kanban', desc:'Arraste este card para outra coluna.', status:'todo'},
    {id:uid(), title:'Criar uma tarefa', desc:'Use o botão no topo da página.', status:'doing'}
  ];
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return fallback;
    const data = JSON.parse(raw);
    if(!Array.isArray(data)) return fallback;
    return data.filter(task => task && typeof task.id === 'string'
      && typeof task.title === 'string' && typeof task.desc === 'string'
      && COLUMNS.some(column => column.id === task.status));
  }catch(error){
    showStorageError('Não foi possível carregar as tarefas salvas.');
    return fallback;
  }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(tasks));
    storageStatus.textContent = '';
    storageStatus.classList.remove('error');
  }catch(error){
    showStorageError('Não foi possível salvar as alterações neste navegador.');
  }
}
function showStorageError(message){
  storageStatus.textContent = message;
  storageStatus.classList.add('error');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const board = document.getElementById('board');

function render(){
  board.innerHTML = COLUMNS.map((col,i)=>{
    const items = tasks.filter(t=>t.status===col.id);
    return `<section class="column" data-col="${col.id}">
      <div class="col-head"><span class="dot" style="background:${col.color}"></span>${col.name}<span class="count">${items.length}</span></div>
      <div class="list">${items.length ? items.map(t=>cardHTML(t,i)).join('') : '<div class="empty">Solte um card aqui</div>'}</div>
    </section>`;
  }).join('');
}

function cardHTML(t,i){
  const prev = i>0 ? `<button class="icon" data-move="${t.id}" data-dir="-1" aria-label="Mover para a esquerda">←</button>` : '';
  const next = i<COLUMNS.length-1 ? `<button class="icon" data-move="${t.id}" data-dir="1" aria-label="Mover para a direita">→</button>` : '';
  return `<article class="card" draggable="true" data-id="${t.id}">
    <div class="card-top"><h3>${esc(t.title)}</h3>
      <button class="icon" data-del="${t.id}" aria-label="Deletar tarefa" title="Deletar">✕</button></div>
    ${t.desc ? `<p>${esc(t.desc)}</p>` : ''}
    <div class="moves">${prev}${next}</div>
  </article>`;
}

/* Drag and drop nativo */
board.addEventListener('dragstart', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  dragId = card.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
  setTimeout(()=>card.classList.add('dragging'),0);
});
board.addEventListener('dragend', ()=>{
  dragId = null;
  document.querySelectorAll('.dragging').forEach(c=>c.classList.remove('dragging'));
  document.querySelectorAll('.over').forEach(c=>c.classList.remove('over'));
});
board.addEventListener('dragover', e=>{
  const col = e.target.closest('.column'); if(!col || !dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.over').forEach(c=>{ if(c!==col) c.classList.remove('over'); });
  col.classList.add('over');
});
board.addEventListener('dragleave', e=>{
  const col = e.target.closest('.column');
  if(col && !col.contains(e.relatedTarget)) col.classList.remove('over');
});
board.addEventListener('drop', e=>{
  const col = e.target.closest('.column'); if(!col || !dragId) return;
  e.preventDefault();
  const task = tasks.find(t=>t.id===dragId); if(!task) return;
  // posição: antes do card sobre o qual o cursor está (abaixo do ponto médio -> depois)
  const over = e.target.closest('.card');
  tasks = tasks.filter(t=>t.id!==dragId);
  task.status = col.dataset.col;
  let idx = tasks.length;
  if(over && over.dataset.id !== dragId){
    const r = over.getBoundingClientRect();
    const before = e.clientY < r.top + r.height/2;
    const ti = tasks.findIndex(t=>t.id===over.dataset.id);
    if(ti>-1) idx = before ? ti : ti+1;
  }
  tasks.splice(idx,0,task);
  save(); render();
});

/* Deletar e mover (fallback para telas de toque) */
board.addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){ tasks = tasks.filter(t=>t.id!==del.dataset.del); save(); render(); return; }
  const mv = e.target.closest('[data-move]');
  if(mv){
    const t = tasks.find(x=>x.id===mv.dataset.move);
    const i = COLUMNS.findIndex(c=>c.id===t.status) + Number(mv.dataset.dir);
    if(COLUMNS[i]){ t.status = COLUMNS[i].id; save(); render(); }
  }
});

/* Modal */
const modal = document.getElementById('modal');
const form = document.getElementById('form');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
document.getElementById('addBtn').onclick = ()=>{ form.reset(); modal.showModal(); titleEl.focus(); };
document.getElementById('cancel').onclick = ()=>modal.close();
modal.addEventListener('click', e=>{ if(e.target===modal) modal.close(); });
form.addEventListener('submit', e=>{
  e.preventDefault();
  const title = titleEl.value.trim(); if(!title) return;
  tasks.push({id:uid(), title, desc:descEl.value.trim(), status:'todo'});
  save(); render(); modal.close();
});

render();
save();
</script>
</body>
</html>
