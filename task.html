<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asper — Detalhes da Tarefa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="task-detail">
  <header class="app-header">
    <a class="brand" href="kanban.html"><span class="brand-mark">A</span>Asper</a>
    <a class="text-link" href="kanban.html">← Voltar para o quadro</a>
  </header>
  <main class="board-main">
    <div class="auth-card" style="max-width: 700px; margin: 0 auto;">
      <h1 id="task-page-title" style="font-size: 24px; margin-bottom: 10px;">Carregando tarefa...</h1>
      <p id="task-page-desc" style="color: var(--color-muted); margin-bottom: 20px;"></p>
      
      <hr style="border: 0; border-top: 1px solid var(--color-border); margin: 20px 0;">
      
      <h3>Detalhes e Recursos</h3>
      <div class="field" style="margin-top: 15px;">
        <label>Prioridade</label>
        <span id="task-page-priority" class="text-accent">-</span>
      </div>
      <div class="field">
        <label>Prazo de Entrega</label>
        <span id="task-page-due">-</span>
      </div>
      <div class="field">
        <label>Responsável</label>
        <span id="task-page-assignee">-</span>
      </div>
    </div>
  </main>
  <script src="js/auth.js" defer></script>
  <script src="js/task-detail.js" defer></script>
</body>
</html>
