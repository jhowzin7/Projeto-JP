<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asper — Detalhes da Tarefa</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .comment-box { background: rgba(255,255,255,0.04); padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="kanban.html"><span class="brand-mark">A</span>Asper</a>
    <a class="text-link" href="kanban.html">← Voltar ao Quadro</a>
  </header>

  <main class="board-main">
    <div class="auth-card" style="max-width: 760px; margin: 0 auto;">
      <p class="eyebrow" id="board-name-display">QUADRO</p>
      <input id="edit-title" class="input" style="font-size: 22px; font-weight: 700; margin-bottom: 10px;">
      <textarea id="edit-desc" class="input" rows="3" placeholder="Descrição da tarefa..."></textarea>

      <div class="grid-2">
        <div class="field">
          <label>Status</label>
          <select id="edit-status">
            <option value="todo">A Fazer</option>
            <option value="progress">Em Andamento</option>
            <option value="done">Concluído</option>
          </select>
        </div>
        <div class="field">
          <label>Responsável</label>
          <select id="edit-assignee"></select>
        </div>
        <div class="field">
          <label>Prioridade</label>
          <select id="edit-priority">
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>
        <div class="field">
          <label>Label</label>
          <select id="edit-label">
            <option value="feature">Feature</option>
            <option value="bug">Bug</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>
        <div class="field">
          <label>Prazo</label>
          <input id="edit-due" type="date">
        </div>
        <div class="field">
          <label>Story Points</label>
          <input id="edit-points" type="number" min="1" max="21">
        </div>
      </div>

      <div class="field">
        <label>Critérios de Aceite / Definition of Done (Scrum)</label>
        <textarea id="edit-criteria" rows="2" placeholder="Ex: Testado com 2 usuários e publicado..."></textarea>
      </div>

      <button id="save-task-btn" class="button button-primary" type="button">Salvar Alterações</button>

      <hr style="margin: 24px 0; border-color: var(--color-border);">

      <!-- Checklist -->
      <h3>Checklist (<span id="checklist-progress">0%</span>)</h3>
      <div id="checklist-items" style="margin: 10px 0;"></div>
      <form id="checklist-form" style="display: flex; gap: 8px; margin-bottom: 24px;">
        <input id="new-subtask" type="text" placeholder="Nova subtarefa..." style="flex: 1;">
        <button type="submit" class="button button-ghost">Adicionar</button>
      </form>

      <!-- Comentários -->
      <h3>Comentários</h3>
      <div id="comments-list" style="margin: 10px 0;"></div>
      <form id="comment-form" style="display: flex; gap: 8px;">
        <input id="new-comment" type="text" placeholder="Escreva um comentário..." required style="flex: 1;">
        <button type="submit" class="button button-primary">Comentar</button>
      </form>
    </div>
  </main>

  <script src="js/auth.js" defer></script>
  <script src="js/task-detail.js" defer></script>
</body>
</html>
