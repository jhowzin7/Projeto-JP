<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Asper — Detalhes da tarefa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="task-detail">
  <header class="app-header">
    <a class="brand" href="kanban.html" aria-label="Asper — voltar ao quadro">
      <span class="brand-mark" aria-hidden="true">A</span>Asper
    </a>
    <a class="button button-outline button-small" href="kanban.html"><span aria-hidden="true">←</span> Voltar ao quadro</a>
  </header>

  <main class="task-detail-main">
    <article class="task-editor">
      <header class="task-editor-header">
        <div>
          <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> DETALHES DA TAREFA</p>
          <p class="task-board-name" id="board-name-display">QUADRO</p>
        </div>
        <span class="task-editor-icon" aria-hidden="true">✦</span>
      </header>

      <div class="field task-title-field">
        <label class="sr-only" for="edit-title">Título da tarefa</label>
        <input id="edit-title" class="input task-title-input" aria-label="Título da tarefa">
      </div>
      <div class="field">
        <label for="edit-desc">Descrição</label>
        <textarea id="edit-desc" class="input" rows="3" placeholder="Descreva a tarefa e adicione contexto..."></textarea>
      </div>

      <section class="task-section" aria-labelledby="task-properties-title">
        <div class="section-heading">
          <div><p class="eyebrow">ORGANIZAÇÃO</p><h2 id="task-properties-title">Propriedades</h2></div>
        </div>
        <div class="form-grid task-properties">
          <div class="field">
            <label for="edit-status">Status</label>
            <select id="edit-status">
              <option value="todo">A Fazer</option>
              <option value="progress">Em Andamento</option>
              <option value="done">Concluído</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-assignee">Responsável</label>
            <select id="edit-assignee"></select>
          </div>
          <div class="field">
            <label for="edit-priority">Prioridade</label>
            <select id="edit-priority">
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-label">Categoria</label>
            <select id="edit-label">
              <option value="feature">Feature</option>
              <option value="bug">Bug</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-due">Prazo</label>
            <input id="edit-due" type="date">
          </div>
          <div class="field">
            <label for="edit-points">Story points</label>
            <input id="edit-points" type="number" min="1" max="21">
          </div>
        </div>
        <div class="field">
          <label for="edit-criteria">Critérios de aceite</label>
          <textarea id="edit-criteria" rows="3" placeholder="Como saberemos que esta tarefa está concluída?"></textarea>
        </div>
        <div class="task-save-row">
          <span class="save-hint">As alterações são salvas neste navegador.</span>
          <button id="save-task-btn" class="button button-primary" type="button">Salvar alterações <span aria-hidden="true">→</span></button>
        </div>
      </section>

      <section class="task-section" aria-labelledby="checklist-title">
        <div class="section-heading section-heading-inline">
          <div><p class="eyebrow">ACOMPANHAMENTO</p><h2 id="checklist-title">Checklist</h2></div>
          <span class="progress-pill" id="checklist-progress">0%</span>
        </div>
        <div id="checklist-items" class="checklist-items"></div>
        <form id="checklist-form" class="inline-entry">
          <label class="sr-only" for="new-subtask">Nova subtarefa</label>
          <input id="new-subtask" type="text" placeholder="Adicionar um item à lista..." required>
          <button type="submit" class="button button-secondary">Adicionar</button>
        </form>
      </section>

      <section class="task-section comments-section" aria-labelledby="comments-title">
        <div class="section-heading">
          <div><p class="eyebrow">CONVERSA</p><h2 id="comments-title">Comentários</h2></div>
        </div>
        <div id="comments-list" class="comments-list"></div>
        <form id="comment-form" class="inline-entry">
          <label class="sr-only" for="new-comment">Escreva um comentário</label>
          <input id="new-comment" type="text" placeholder="Compartilhe uma atualização..." required>
          <button type="submit" class="button button-primary">Comentar <span aria-hidden="true">→</span></button>
        </form>
      </section>
    </article>
  </main>

  <script src="js/auth.js" defer></script>
  <script src="js/task-detail.js" defer></script>
</body>
</html>
